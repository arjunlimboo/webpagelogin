<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="container">

    <div class="left-panel">

        <div class="moon"></div>

        <div class="birds">
            🐦 🐦
        </div>

        <div class="welcome">

            <h2>Dashboard</h2>

            <p>
                Welcome back to your personal dashboard.
                Manage your account and monitor your profile.
            </p>

        </div>

    </div>

    <div class="right-panel">

        <div class="dashboard">

            <div class="top-card">

                <h1>
                    Welcome,
                    <span id="fullName">
                        Loading...
                    </span>
                </h1>

                <p id="todayDate"></p>

            </div>

            <div class="cards">

                <div class="card">
                    <i class="fas fa-user"></i>
                    <h3>Profile</h3>
                    <p>Manage account details</p>
                </div>

                <div class="card">
                    <i class="fas fa-phone"></i>
                    <h3 id="phone">
                        Loading...
                    </h3>
                    <p>Phone Number</p>
                </div>

                <div class="card">
                    <i class="fas fa-calendar"></i>
                    <h3 id="dob">
                        Loading...
                    </h3>
                    <p>Date of Birth</p>
                </div>

                <div class="card">
                    <i class="fas fa-envelope"></i>
                    <h3 id="email">
                        Loading...
                    </h3>
                    <p>Email Address</p>
                </div>

            </div>

            <div class="buttons">

                <button id="editBtn">
                    Edit Profile
                </button>

                <button id="profileBtn">
                    View Profile
                </button>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </div>

    </div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
