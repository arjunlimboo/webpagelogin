<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <div class="moon"></div>

        <div class="birds">
            🐦🐦
        </div>

        <div class="welcome">
            <h2>Welcome Back</h2>

            <p>
                Login to access your dashboard and continue
                exploring all the amazing features available
                for you.
            </p>

            <div class="social-title">
                GET CONNECTED WITH
            </div>

            <div class="social-icons">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-google-plus-g"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
            </div>

        </div>

    </div>

    <!-- RIGHT PANEL -->
    
    <div class="right-panel">

        <div class="tabs">
            <button id="loginBtn" class="signin active">Sign In</button>
            <button id="registerBtn" class="register">Register</button>
        </div>

        <form id="loginForm" class="form">

            <h1>Login</h1>

            <label>Email</label>
           <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="********"
                required
            >

            <div class="checkbox">
                <input type="checkbox" id="remember">

                <span>
                    Remember Me
                </span>
            </div>

            <button type="submit" class="signup-btn">
                Sign In
            </button>

            <p class="register-link">
                Don't have an account?
                <a href="../register/index.html">Register Now</a>
            </p>

        </form>

    </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
