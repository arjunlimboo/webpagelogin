<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="homepage.css">

</head>
<body>

<div class="container">

    <div class="left-panel">

        <div class="moon"></div>

        <div class="birds">
            🐦 🐦
        </div>

        <div class="welcome">

            <h1>Web System</h1>

            <p>
                A complete user management system built with
                HTML, CSS, JavaScript and Firebase Authentication.
            </p>

            <div class="features">

                <div class="feature">
                    <i class="fas fa-user-plus"></i>
                    User Registration
                </div>

                <div class="feature">
                    <i class="fas fa-lock"></i>
                    Secure Login
                </div>

                <div class="feature">
                    <i class="fas fa-user"></i>
                    Profile Management
                </div>

                <div class="feature">
                    <i class="fas fa-pen"></i>
                    Edit User Details
                </div>

            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="home-card">

            <div class="logo">
                <i class="fas fa-user-shield"></i>
            </div>

            <h1>Welcome</h1>

            <p>
                Register a new account or login to access your dashboard.
            </p>

            <button id="loginBtn" class="login-btn">
                Login
            </button>

            <button id="registerBtn" class="register-btn">
                Register
            </button>

        </div>

    </div>

</div>

<script type="module" src="homepage.js"></script>

</body>
</html>
