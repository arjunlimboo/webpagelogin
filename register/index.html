<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/css/intlTelInput.css">
</head>
<body>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <div class="moon"></div>

        <div class="birds">
            🐦🐦
        </div>

        <div class="welcome">
            <h2>Welcome Page</h2>

            <p>
                Lorem ipsum dolor sit amet, consectetur
                adipisicing elit. Donec pharetra lacinia
                maximus. Integer pulvinar lacus.
            </p>

            <div class="social-title">
                GET CONNECTED WITH
            </div>

            <div class="social-icons">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-google-plus-g"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
            </div>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="tabs">
            <button id="loginBtn" class="signin" >Sign In</button>
            <button id="registerBtn" class="register active">Register</button>
        </div>
       

        <form id="registerForm" class="form"> 

            <h1>Register</h1>

            <label>FULL NAME</label>
            <input id="fullName" type="text" placeholder="Enter Your Full Name">

            <label>EMAIL</label>
            <input id="email" type="email" placeholder="Enter Your Email">

            <label>Phone No.</label>
            <input id="phone" type="tel" placeholder="Enter Your Number">

            <label>Username</label>
            <input id="username" type="text" placeholder="Enter Your Number"> 

             <label>Date of Birth</label>
            <input id="dateOfBirth" type="date" placeholder="Enter Your DOB"> 

            <label>Password</label>
            <input id="password" type="password" placeholder="********">

             <label>Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="********">

            <div class="checkbox">
                <input type="checkbox" checked>

                <span>
                    I agree all the statements in
                    <a href="#">Terms of service</a>
                </span>
            </div>
                <p id="message"></p>
            <button class="signup-btn">
                Sign Up
            </button>

        </form>

    </div>

</div>
 <p id="message"></p>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/intlTelInput.min.js"></script>

<script type="module" src="script.js"></script>
</body>
</html>
