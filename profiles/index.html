<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#0f172a;
}

.container{
    display:flex;
    min-height:100vh;
}

.left-panel{
    width:40%;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.moon{
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50px;
    left:50px;
}

.birds{
    position:absolute;
    top:70px;
    right:80px;
    font-size:28px;
}

.welcome{
    width:80%;
    text-align:center;
}

.welcome h2{
    font-size:42px;
    margin-bottom:20px;
}

.welcome p{
    line-height:1.8;
    color:#d1d5db;
}

.right-panel{
    width:60%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.profile-card{
    width:550px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    padding:40px;
}

.profile-header{
    text-align:center;
    margin-bottom:30px;
}

.profile-icon{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:50px;
}

.profile-header h1{
    margin-top:15px;
}

.info-box{
    background:#f8fafc;
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
}

.info-box span{
    display:block;
    color:#64748b;
    font-size:13px;
}

.info-box p{
    margin-top:5px;
    font-weight:bold;
    color:#0f172a;
}

.logout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ef4444;
    color:white;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

.logout-btn:hover{
    opacity:.9;
}

</style>
</head>
<body>

<div class="container">

    <div class="left-panel">

        <div class="moon"></div>

        <div class="birds">
            🐦 🐦
        </div>

        <div class="welcome">

            <h2>Welcome Back</h2>

            <p>
                Your account has been successfully authenticated.
                Manage your profile and access all system features.
            </p>

            <div class="social-title">
                ACCOUNT STATUS
            </div>

            <div class="status">
                <i class="fas fa-circle-check"></i>
                Active User
            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-icon">
                    <i class="fas fa-user"></i>
                </div>

                <h1>User Profile</h1>

            </div>

            <div class="info-box">
                <span>Full Name</span>
                <p id="fullName">Loading...</p>
            </div>

            <div class="info-box">
                <span>Email</span>
                <p id="email">Loading...</p>
            </div>

            <div class="info-box">
                <span>Username</span>
                <p id="username">Loading...</p>
            </div>

            <div class="info-box">
                <span>Phone Number</span>
                <p id="phone">Loading...</p>
            </div>

            <div class="info-box">
                <span>Date of Birth</span>
                <p id="dob">Loading...</p>
            </div>

           <button id="editProfileBtn" class="edit-btn">
    Edit Profile
</button>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
